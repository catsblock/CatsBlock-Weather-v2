name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Create the repository secrets KEYSTORE_BASE64 and KS_PASS."
            exit 1
          fi

      - name: Check backend secrets
        env:
          CLOUDFLARE_WEBSITE: ${{ secrets.CLOUDFLARE_WEBSITE }}
        run: |
          if [ -z "$CLOUDFLARE_WEBSITE" ]; then
            echo "::error::Create the repository secret CLOUDFLARE_WEBSITE with the deployed Cloudflare Worker URL."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cats.p12"
          echo "KS_PATH=$RUNNER_TEMP/cats.p12" >> "$GITHUB_ENV"

      - name: Prepare launcher icon
        timeout-minutes: 4
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          ICON="Image/Appicon/Icon.jpg"
          if [ ! -f "$ICON" ]; then
            echo "::warning::$ICON was not found; keeping the bundled vector icon."
            exit 0
          fi
          if ! command -v convert >/dev/null 2>&1; then
            sudo -E timeout 60 apt-get update -qq || true
            sudo -E timeout 150 apt-get install -y -qq --no-install-recommends imagemagick || true
          fi
          mkdir -p app/src/main/res/drawable-nodpi
          BG=$(convert "$ICON" -format '%[hex:p{2,2}]' info: | cut -c1-6)
          if timeout 30 convert -size 432x432 "xc:#$BG" app/src/main/res/drawable-nodpi/ic_launcher_sky.png \
            && timeout 30 convert "$ICON" -resize 288x288 -background none -gravity center -extent 432x432 app/src/main/res/drawable-nodpi/ic_launcher_foreground.png; then
            rm -f app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_monochrome.xml app/src/main/res/drawable/ic_launcher_sky.xml
          else
            echo "::warning::Could not generate the launcher icon; keeping the bundled vector icon."
            rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png app/src/main/res/drawable-nodpi/ic_launcher_sky.png
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          CLOUDFLARE_WEBSITE: ${{ secrets.CLOUDFLARE_WEBSITE }}
        run: gradle assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Locate APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -f "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.catsblock.weather
          path: ${{ env.APK_PATH }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: ${{ env.APK_PATH }}
