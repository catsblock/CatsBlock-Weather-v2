name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Create the repository secrets KEYSTORE_BASE64 and KS_PASS."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cats.p12"
          echo "KS_PATH=$RUNNER_TEMP/cats.p12" >> "$GITHUB_ENV"

      - name: Prepare launcher icon
        timeout-minutes: 4
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1 || ! command -v convert >/dev/null 2>&1; then
            sudo -E timeout 60 apt-get update -qq || true
            sudo -E timeout 150 apt-get install -y -qq --no-install-recommends librsvg2-bin imagemagick || true
          fi
          mkdir -p app/src/main/res/drawable-nodpi
          if timeout 30 curl -fsSL --connect-timeout 10 --max-time 25 "https://raw.githubusercontent.com/mrdarrengriffin/google-weather-icons/refs/heads/main/sets/set-5/light/mostly_sunny.svg" -o "$RUNNER_TEMP/icon.svg" \
            && timeout 30 rsvg-convert -w 280 --keep-aspect-ratio "$RUNNER_TEMP/icon.svg" -o "$RUNNER_TEMP/fg.png" \
            && timeout 30 convert -size 432x432 xc:none "$RUNNER_TEMP/fg.png" -gravity center -composite app/src/main/res/drawable-nodpi/ic_launcher_foreground.png; then
            rm -f app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_monochrome.xml
          else
            echo "::warning::Could not generate the launcher icon; keeping the bundled vector icon."
            rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          VISUAL_API_KEY: ${{ secrets.VISUAL_API_KEY }}
        run: gradle assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Locate APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -f "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.catsblock.weather
          path: ${{ env.APK_PATH }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: ${{ env.APK_PATH }}
