name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Process Google Weather launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          curl -fsSL "https://raw.githubusercontent.com/mrdarrengriffin/google-weather-icons/refs/heads/main/sets/set-4/light/mostly_clear_day.svg" -o /tmp/icon.svg
          rsvg-convert -w 260 --keep-aspect-ratio /tmp/icon.svg -o /tmp/fg.png
          mkdir -p app/src/main/res/drawable-nodpi
          convert -size 432x432 xc:none /tmp/fg.png -gravity center -composite app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_monochrome.xml

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK build
        run: |
          if [ -z "$(ls -A app/build/outputs/apk/debug/*.apk 2>/dev/null)" ]; then
            echo "O arquivo APK não foi gerado no diretório esperado!"
            exit 1
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/debug/*.apk
