name: Build APK and EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Read release configuration
        run: |
          if [ ! -f app-config.json ]; then
            echo "::error::app-config.json was not found in the repository root."
            exit 1
          fi
          TESTONLY=$(jq -r 'if (.testonly | type) == "boolean" then (.testonly | tostring) else "invalid" end' app-config.json)
          case "$TESTONLY" in
            true|false) ;;
            *)
              echo "::error::app-config.json must contain a boolean \"testonly\" value."
              exit 1
              ;;
          esac
          echo "TESTONLY=$TESTONLY" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Create the repository secrets KEYSTORE_BASE64 and KS_PASS."
            exit 1
          fi

      - name: Check backend secrets
        env:
          CLOUDFLARE_WEBSITE: ${{ secrets.CLOUDFLARE_WEBSITE }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_WEBSITE" ]; then
            echo "::error::Create the repository secret CLOUDFLARE_WEBSITE with the deployed Cloudflare Worker URL."
            exit 1
          fi
          if [ "${#APP_TOKEN}" -lt 32 ]; then
            echo "::error::Create the repository secret APP_TOKEN with the same value (at least 32 characters) as the Worker secret APP_TOKEN."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cats.p12"
          echo "KS_PATH=$RUNNER_TEMP/cats.p12" >> "$GITHUB_ENV"

      - name: Prepare launcher icon
        timeout-minutes: 4
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          ICON="assets/appicon/Icon.jpg"
          if [ ! -f "$ICON" ]; then
            echo "::warning::$ICON was not found; keeping the bundled vector icon."
            exit 0
          fi
          if ! command -v convert >/dev/null 2>&1; then
            sudo -E timeout 60 apt-get update -qq || true
            sudo -E timeout 150 apt-get install -y -qq --no-install-recommends imagemagick || true
          fi
          mkdir -p app/src/main/res/drawable-nodpi
          BG=$(convert "$ICON" -format '%[hex:p{2,2}]' info: | cut -c1-6)
          if timeout 30 convert -size 432x432 "xc:#$BG" app/src/main/res/drawable-nodpi/ic_launcher_sky.png \
            && timeout 30 convert "$ICON" -resize 288x288 -background none -gravity center -extent 432x432 app/src/main/res/drawable-nodpi/ic_launcher_foreground.png; then
            rm -f app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_monochrome.xml app/src/main/res/drawable/ic_launcher_sky.xml
          else
            echo "::warning::Could not generate the launcher icon; keeping the bundled vector icon."
            rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png app/src/main/res/drawable-nodpi/ic_launcher_sky.png
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          CLOUDFLARE_WEBSITE: ${{ secrets.CLOUDFLARE_WEBSITE }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: gradle assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }} -PbuildDate=${{ env.BUILD_DATE }}

      - name: Locate APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -f "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Summarize build
        run: |
          if [ "$TESTONLY" = "true" ]; then
            echo "### Test build (testonly = true)" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK is attached to this run as the \`com.catsblock.weather\` artifact. No GitHub release was created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release build (testonly = false)" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK is attached to this run and published in the Releases tab." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.catsblock.weather
          path: ${{ env.APK_PATH }}

      - name: Compute release name
        if: env.TESTONLY == 'false'
        run: |
          D=$(date -u -d "$BUILD_DATE" +%d); M=$(date -u -d "$BUILD_DATE" +%-m); Y=$(date -u -d "$BUILD_DATE" +%Y)
          echo "RELEASE_NAME=$D.$M.$Y.${{ github.run_number }}.31201921215311-RELEASE" >> "$GITHUB_ENV"

      - name: Create release
        if: env.TESTONLY == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          files: ${{ env.APK_PATH }}

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Read release configuration
        shell: pwsh
        run: |
          if (-not (Test-Path app-config.json)) {
            Write-Output "::error::app-config.json was not found in the repository root."
            exit 1
          }
          $cfg = Get-Content app-config.json -Raw | ConvertFrom-Json
          if ($cfg.testonly -isnot [bool]) {
            Write-Output "::error::app-config.json must contain a boolean testonly value."
            exit 1
          }
          "TESTONLY=$($cfg.testonly.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Windows icon
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path "assets/appicon/Icon.jpg"))
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($src, 0, 0, 256, 256)
          $png = New-Object System.IO.MemoryStream
          $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          $data = $png.ToArray()
          $out = New-Object System.IO.MemoryStream
          $w = New-Object System.IO.BinaryWriter $out
          $w.Write([UInt16]0); $w.Write([UInt16]1); $w.Write([UInt16]1)
          $w.Write([byte]0); $w.Write([byte]0); $w.Write([byte]0); $w.Write([byte]0)
          $w.Write([UInt16]1); $w.Write([UInt16]32)
          $w.Write([UInt32]$data.Length); $w.Write([UInt32]22)
          $w.Write($data)
          $w.Flush()
          [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) "desktop/icon.ico"), $out.ToArray())

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $wix) {
            Write-Output "::error::WiX Toolset could not be found or installed."
            exit 1
          }
          Join-Path $wix.FullName "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer
        shell: pwsh
        run: gradle :desktop:packageExe --no-daemon --stacktrace "-PbuildNumber=${{ github.run_number }}"

      - name: Locate EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/build/compose/binaries -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Output "::error::No EXE was produced."
            exit 1
          }
          ("EXE_PATH=" + ($exe.FullName -replace '\\', '/')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.catsblock.weather.windows
          path: ${{ env.EXE_PATH }}

      - name: Attach EXE to release
        if: env.TESTONLY == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.EXE_PATH }}
